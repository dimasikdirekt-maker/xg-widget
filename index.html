<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>.xG — виджет сообщества</title>
<style>
:root{--night:#0B0C0B;--graphite:#171917;--line:#2F322F;--chalk:#EDEDE6;--neon:#C6FF2E;--muted:#9a9d97}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--chalk);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 18px 60px}
.wrap{max-width:720px;margin:0 auto}
.logo{display:flex;align-items:flex-end;font-weight:900;font-size:44px;letter-spacing:-.05em;line-height:.8}
.logo i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--neon);margin:0 -1px 4px 0;box-shadow:0 0 14px rgba(198,255,46,.6)}
.kick{font:12px/1 ui-monospace,"DejaVu Sans Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);margin:18px 0 6px}
h1{font-size:26px;font-weight:800;margin-bottom:6px}
p.lead{color:var(--muted);margin-bottom:22px}
.card{background:var(--graphite);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.prev figure{background:var(--night);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prev img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover}
.prev figcaption{padding:8px 10px;font-size:13px}
.prev figcaption b{display:block}
.prev figcaption span{color:var(--muted);font-size:12px}
button{font:inherit;font-weight:700;background:var(--neon);color:var(--night);border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.log{font:13px/1.55 ui-monospace,"DejaVu Sans Mono",monospace;color:var(--muted);white-space:pre-wrap;word-break:break-word;margin-top:14px}
.ok{color:var(--neon)}.err{color:#ff7a6b}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><i></i>xG</div>
  <div class="kick">Футбольный квиз · Краснодар</div>
  <h1>Виджет сообщества</h1>
  <p class="lead" id="lead">Публикует на странице сообщества виджет из трёх плиток.</p>

  <div class="card">
    <div class="prev" id="prev"></div>
    <button id="go">Опубликовать виджет</button>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.5/dist/browser.min.js"></script>
<script>
const V = '5.199';
const GROUP = 242323022;
const APP_ID = 54825137;
const TILES = [
  {img:'img/raspisanie.jpg', title:'Расписание', descr:'Первая игра — скоро', url:'https://vk.com/wall-242323022_4'},
  {img:'img/pravila.jpg',    title:'Правила игры', descr:'Как играть в .xG', url:'https://vk.com/wall-242323022_2'},
  {img:'img/sygray.jpg',     title:'Сыграй сейчас', descr:'Вопрос недели', url:'https://vk.com/wall-242323022_3'}
];
const WIDGET = {title:'Футбольный квиз .xG', more:'Записаться на игру', more_url:'https://vk.com/app5619682_-242323022'};

const $ = id => document.getElementById(id);
const log = (t, cls) => { const s = document.createElement('div'); if (cls) s.className = cls; s.textContent = t; $('log').appendChild(s); };
$('prev').innerHTML = TILES.map(t => `<figure><img src="${t.img}" alt=""><figcaption><b>${t.title}</b><span>${t.descr}</span></figcaption></figure>`).join('');

const qs = new URLSearchParams(location.search);
const inVk = !!qs.get('vk_app_id');
if (inVk) vkBridge.send('VKWebAppInit');
else { $('lead').textContent = 'Откройте это приложение внутри ВКонтакте: vk.com/app' + APP_ID; $('go').disabled = true; }

let token = '';
function api(method, params){
  return vkBridge.send('VKWebAppCallAPIMethod', {method, params: Object.assign({v: V, access_token: token}, params)})
    .then(r => r.response);
}
const errText = e => { try { const d = e.error_data || e; return JSON.stringify(d.error_reason || d); } catch(_) { return String(e); } };

$('go').onclick = async () => {
  $('go').disabled = true; $('log').innerHTML = '';
  try {
    log('1/4 Запрашиваю доступ к виджету сообщества…');
    const groupId = +(qs.get('vk_group_id') || GROUP);
    const tk = await vkBridge.send('VKWebAppGetCommunityToken', {app_id: +qs.get('vk_app_id') || APP_ID, group_id: groupId, scope: 'app_widget'});
    token = tk.access_token;
    log('   доступ получен ✓', 'ok');

    log('2/4 Получаю адрес загрузки…');
    const srv = await api('appWidgets.getGroupImageUploadServer', {image_type: '160x240'});
    log('   ✓', 'ok');

    log('3/4 Загружаю картинки…');
    for (const t of TILES) {
      const blob = await (await fetch(t.img, {cache: 'no-store'})).blob();
      const fd = new FormData(); fd.append('image', blob, t.img.split('/').pop());
      let up;
      try {
        up = await (await fetch(srv.upload_url, {method: 'POST', body: fd})).json();
      } catch (e) {
        throw {error_data: {error_reason: 'Сервер загрузки ВК не принял файл из браузера (CORS): ' + e.message}};
      }
      if (!up.hash) throw {error_data: {error_reason: 'Ответ загрузки: ' + JSON.stringify(up)}};
      const saved = await api('appWidgets.saveGroupImage', {hash: up.hash, image: up.image});
      t.icon_id = saved.id;
      log('   ' + t.title + ' ✓', 'ok');
    }

    log('4/4 Публикую виджет…');
    const w = Object.assign({}, WIDGET, {tiles: TILES.map(t => ({title: t.title, descr: t.descr, url: t.url, link: 'Открыть', link_url: t.url, icon_id: t.icon_id}))});
    const code = 'return ' + JSON.stringify(w) + ';';
    await api('appWidgets.update', {type: 'tiles', code});
    log('Готово! Виджет опубликован на странице сообщества ✓', 'ok');
  } catch (e) {
    log('Ошибка: ' + errText(e), 'err');
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
